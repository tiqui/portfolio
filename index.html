<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redellen Yuri | Portfólio Full-Stack</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --text-color: #c9d1d9;
            --accent-color: #4AF626;
            --card-bg: #161b22;
        }
        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            line-height: 1.6;
        }
        header {
            border-bottom: 2px solid var(--accent-color);
            padding-bottom: 20px;
            margin-bottom: 40px;
        }
        h1, h2 {
            color: var(--accent-color);
        }
        .container {
            max-width: 900px;
            margin: auto;
        }
        .project-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }
        .project-card {
            background-color: var(--card-bg);
            border: 1px solid #30363d;
            padding: 20px;
            border-radius: 6px;
        }
        .project-card h3 {
            margin-top: 0;
            color: var(--accent-color);
        }
        .tag {
            background-color: #21262d;
            border: 1px solid #30363d;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.8em;
            margin-right: 5px;
        }
        a {
            color: var(--accent-color);
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
        .terminal {
            background: #000;
            padding: 15px;
            border-left: 4px solid var(--accent-color);
            margin-bottom: 30px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>> tiqui </h1>
            <p> - </p>
            <p>GitHub: <a href="https://github.com/tiqui" target="_blank">github.com/tiqui</a></p>
        </header>

        <section class="terminal">
            <p><span style="color:var(--accent-color)">yuri@server:~$</span> cat about.txt</p>
            <p>SITE EM MANUTENÇÃO!</p>
        </section>

            </div>
        </div>
    </div>
</body>
</html>
