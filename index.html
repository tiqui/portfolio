<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Em Manutenção</title>
    <style>
        :root {
            --bg: #090a0f;
            --surface: #12151c;
            --border: #212630;
            --text-main: #f0f3f6;
            --text-muted: #8b949e;
            --accent: #58a6ff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
        }

        .card {
            width: 100%;
            max-width: 480px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 40px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            position: relative;
            overflow: hidden;
        }

        .badge {
            display: inline-block;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--accent);
            background: rgba(88, 166, 255, 0.1);
            padding: 4px 10px;
            border-radius: 20px;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 1.75rem;
            font-weight: 700;
            margin-bottom: 12px;
            letter-spacing: -0.5px;
        }

        p {
            color: var(--text-muted);
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 32px;
        }

        .contacts {
            border-top: 1px solid var(--border);
            padding-top: 24px;
        }

        .contacts-title {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 12px;
        }

        .contact-links {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
        }

        .contact-links a {
            color: var(--text-main);
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 500;
            transition: color 0.2s ease;
            position: relative;
        }

        .contact-links a::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 1px;
            bottom: -2px;
            left: 0;
            background-color: var(--accent);
            transform: scaleX(0);
            transform-origin: right;
            transition: transform 0.3s ease;
        }

        .contact-links a:hover {
            color: var(--accent);
        }

        .contact-links a:hover::after {
            transform: scaleX(1);
            transform-origin: left;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="badge">Status: 503</div>
        <h1>Construindo algo novo por aqui.</h1>
        <p>
            O site está temporariamente fora do ar enquanto preparo uma nova versão com novos projetos e atualizações. Volto em breve.
        </p>

        <div class="contacts">
            <div class="contacts-title">Contatos</div>
            <div class="contact-links">
                <a href="https://github.com/tiqui" target="_blank" rel="noopener">GitHub</a>
                <a href="https://www.linkedin.com/in/redellen-neris" target="_blank" rel="noopener">LinkedIn</a>
            </div>
        </div>
    </div>
</body>
</html>
